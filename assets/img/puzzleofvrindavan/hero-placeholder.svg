<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Puzzle of Vrindavan hero placeholder</title>
  <desc id="desc">Colorful Krishna-inspired puzzle game placeholder artwork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a3a"/>
      <stop offset="0.38" stop-color="#215b74"/>
      <stop offset="0.72" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#7f2d5b"/>
    </linearGradient>
    <pattern id="tiles" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="none" stroke="#fff7e7" stroke-opacity="0.12" stroke-width="3"/>
      <circle cx="60" cy="60" r="26" fill="none" stroke="#fff7e7" stroke-opacity="0.18" stroke-width="4"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.18"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
