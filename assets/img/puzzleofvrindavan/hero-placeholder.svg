  <path d="M0 675 C230 530 450 720 700 560 C950 395 1190 460 1600 285 L1600 900 L0 900 Z" fill="#0b1228" opacity="0.72"/>
  <circle cx="1180" cy="210" r="150" fill="#fff7e7" opacity="0.22"/>
  <path d="M1020 260 C1110 170 1235 150 1320 220 C1210 235 1130 300 1085 390 C1060 335 1040 298 1020 260 Z" fill="#4fd2c2" opacity="0.45"/>
  <circle cx="950" cy="480" r="42" fill="#f2dfbd" opacity="0.72"/>
  <circle cx="1060" cy="545" r="36" fill="#f08a2f" opacity="0.72"/>
  <circle cx="1160" cy="488" r="32" fill="#7f2d5b" opacity="0.74"/>
  <text x="145" y="420" fill="#fff7e7" font-family="Georgia, serif" font-size="94" font-weight="700">PUZZLE OF VRINDAVAN</text>
  <text x="150" y="500" fill="#f2dfbd" font-family="Arial, sans-serif" font-size="34">Hero placeholder - replace with final artwork</text>
